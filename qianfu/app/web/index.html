<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>信鸽 SJTU</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span><span>信鸽 SJTU</span></div>
    <nav id="boards" class="boards"></nav>
    <div class="sidebar-foot">
      <button id="btn-fetch" class="primary">抓取全部</button>
      <div class="btn-row">
        <button id="btn-feeds">订阅</button>
        <button id="btn-diag">诊断</button>
      </div>
      <div id="status" class="status"></div>
    </div>
  </aside>

  <main class="main">
    <!-- 信息流 -->
    <section id="feed-view" class="view">
      <header class="topbar">
        <h1 id="board-title">全部</h1>
        <div class="topbar-right">
          <label class="switch">
            <input type="checkbox" id="only-unread" />
            <span>只看未读</span>
          </label>
          <button id="btn-clear-read" class="mini">清理已读</button>
          <span id="count" class="count"></span>
        </div>
      </header>
      <section id="items" class="items"></section>
    </section>

    <!-- 整页日历 -->
    <section id="calendar-view" class="view" hidden>
      <header class="topbar">
        <h1>日历</h1>
        <div class="topbar-right">
          <div class="cal-nav">
            <button id="cal-prev">‹</button>
            <span id="cal-label"></span>
            <button id="cal-next">›</button>
            <button id="cal-today">今天</button>
          </div>
          <button id="cal-close">返回信息流</button>
        </div>
      </header>
      <div class="big-cal">
        <div class="big-weekhead">
          <span>周一</span><span>周二</span><span>周三</span><span>周四</span>
          <span>周五</span><span>周六</span><span>周日</span>
        </div>
        <div id="big-grid" class="big-grid"></div>
      </div>
    </section>
  </main>

  <!-- 右侧日历栏 -->
  <aside id="rail" class="rail">
    <div class="rail-head">
      <button id="rail-prev">‹</button>
      <span id="rail-label"></span>
      <button id="rail-next">›</button>
      <button id="rail-expand" title="展开整页日历">⤢</button>
    </div>
    <div class="rail-weekhead">
      <span>一</span><span>二</span><span>三</span><span>四</span>
      <span>五</span><span>六</span><span>日</span>
    </div>
    <div id="rail-grid" class="rail-grid"></div>

    <div class="day-head">
      <span id="day-label"></span>
      <button id="day-add" class="mini primary">+ 新建</button>
    </div>
    <div id="day-list" class="day-list"></div>

    <div class="chat">
      <div id="chat-log" class="chat-log"></div>
      <div class="chat-row">
        <input id="chat-input" placeholder="明天下午3点 图书馆开会" />
        <button id="chat-send" class="primary">安排</button>
      </div>
    </div>
  </aside>

  <dialog id="event-dlg">
    <form method="dialog" id="event-form">
      <h2 id="dlg-title">编辑事件</h2>
      <label class="field"><span>题目</span><input id="f-title" required placeholder="输入事件标题…" /></label>
      <label class="field"><span>日期</span><input id="f-date" type="date" required /></label>
      <div class="field-row">
        <label class="field"><span>从</span><input id="f-start" type="time" /></label>
        <label class="field"><span>至</span><input id="f-end" type="time" /></label>
      </div>
      <label class="field"><span>位置</span><input id="f-location" placeholder="输入事件位置…" /></label>
      <label class="field"><span>备注</span><textarea id="f-note" rows="2" placeholder="可选"></textarea></label>
      <div class="dlg-actions">
        <button type="button" id="f-delete" class="danger" hidden>删除</button>
        <span class="spacer"></span>
        <button type="button" id="f-cancel">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="feeds-dlg">
    <h2>RSS / 公众号订阅</h2>
    <p class="hint">公众号没有官方接口，通常先用 <b>WeWe RSS</b> 转成 RSS，再把地址贴到这里。</p>
    <div id="feed-list" class="feed-list"></div>
    <div class="feed-add">
      <input id="feed-name" placeholder="名称，如「某公众号」" />
      <input id="feed-url" placeholder="RSS 地址" />
      <div class="feed-add-row">
        <select id="feed-board">
          <option value="wechat">公众号</option>
          <option value="custom">自定义</option>
        </select>
        <button id="feed-add-btn" class="primary">添加</button>
      </div>
    </div>
    <h2 class="section">慕课课程</h2>
    <p class="hint">在 CNMOOC 打开某门课的「测验与作业」，把地址栏粘过来。关掉开关就不再抓这门课。</p>
    <div id="course-list" class="feed-list"></div>
    <div class="feed-add">
      <input id="course-url" placeholder="…/examTest/stuExamList/28535.mooc" />
      <button id="course-add-btn" class="primary">添加课程</button>
    </div>

    <form method="dialog"><button>关闭</button></form>
  </dialog>

  <dialog id="diag">
    <h2>诊断</h2>
    <div id="diag-body"></div>
    <form method="dialog"><button>关闭</button></form>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
